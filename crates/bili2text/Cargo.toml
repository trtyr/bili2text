[package]
name = "bili2text"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "bili2text"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
asr = { path = "../asr" }
bili-client.workspace = true
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
downloader = { path = "../downloader" }
qrencode = "0.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4"] }
