[package]
name = "bili2text"
description = "Turn Bilibili videos into text: extract subtitles or transcribe locally with SenseVoice, saved as Markdown/SRT"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["bilibili", "subtitle", "transcribe", "asr", "cli"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "bili2text"
path = "src/main.rs"

[features]
default = []
# 本地转写（SenseVoice / sherpa-rs）：依赖 C++ 工具链（cmake），故默认关闭。
transcribe = ["dep:asr"]

[dependencies]
anyhow = "1.0"
asr = { package = "bili2text-asr", path = "../asr", version = "0.3.0", optional = true }
bili-client.workspace = true
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
downloader = { package = "bili2text-downloader", path = "../downloader", version = "0.3.0" }
qrencode = "0.14"
reqwest = { version = "0.13.5", features = ["multipart", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4"] }
