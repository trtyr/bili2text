[package]
name = "bili2text-asr"
description = "SenseVoice local speech-to-text engine (sherpa-rs binding) used by bili2text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["asr", "sensevoice", "speech-recognition"]
categories = ["multimedia::audio"]

[lib]
name = "asr"
path = "src/lib.rs"

[dependencies]
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
sherpa-rs = "0.6.8"
thiserror = "2.0.20"
