[package]
name = "bili-client"
description = "Bilibili web API client: subtitle listing, QR-code login, WBI signature"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["bilibili", "subtitle", "api-client"]
categories = ["api-bindings"]

[dependencies]
md-5 = "0.11.0"
reqwest = { version = "0.13.5", features = ["cookies", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
